name: Sync from "test-server" branch

on:
  push:
    branches:
      - test-server
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    # The Python script will handle loop detection more intelligently
    # by checking if commits are actually being bounced back

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for all branches
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false

      - name: Fetch test-server branch
        run: git fetch origin test-server:test-server

      - name: Sync from test-server to test-all
        run: |
          . git/.git-rc
          ./sync-branches-wrapper.sh --source test-server --target test-all
