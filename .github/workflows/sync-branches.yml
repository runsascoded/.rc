name: Sync from "srv" branch

on:
  push:
    branches:
      - srv
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    # The Python script will handle loop detection more intelligently
    # by checking if commits are actually being bounced back

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for all branches
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false

      - name: Fetch srv branch
        run: git fetch origin srv:srv

      - name: Sync from srv to all
        run: |
          . git/.git-rc
          ./sync-branches-wrapper.sh --source srv --target all
